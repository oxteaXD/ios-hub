name: 构建 IPA

# 推送到 main 时自动构建，也可以在 Actions 页面手动运行。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

# 同一个分支上有新的构建开始时，取消还没跑完的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并打包
    # GitHub 官方托管的 Xcode 27 运行器（macOS 27，arm64）。两个上游项目自己的发版流程用的也是它。
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: 检出代码和上游子模块
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 准备工程（XcodeGen、上游补丁、标签数据）
        run: bash scripts/ci_setup.sh

      - name: 缓存 Swift 包
        uses: actions/cache@v5
        with:
          path: |
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('upstream/versions.json', 'project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: 编译并打包 IPA
        run: bash scripts/build_ipa.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v7
        with:
          name: Hub-ipa
          path: build/Hub.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传完整构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  # 与上面的作业并行：在模拟器里跑宿主壳的界面测试，确认启动和切换模块都正常。
  smoke:
    name: 模拟器界面测试
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: 检出代码和上游子模块
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 准备工程（XcodeGen、上游补丁、标签数据）
        run: bash scripts/ci_setup.sh

      - name: 缓存 Swift 包
        uses: actions/cache@v5
        with:
          path: |
            build/DerivedData-sim/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-sim-${{ runner.os }}-${{ hashFiles('upstream/versions.json', 'project.yml') }}
          restore-keys: |
            spm-sim-${{ runner.os }}-

      - name: 在模拟器里跑界面测试
        run: bash scripts/smoke_test.sh

      # 只上传整理过的测试结果。截图和完整日志不上传：测试会进入 EhPanda 的主页，
      # 它们里面可能带有站点内容，而公开仓库的构建产物谁都能下载。
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: build/smoke/result.txt
          if-no-files-found: ignore
          retention-days: 7
