name: 构建 IPA

# 推送到 main 时自动构建，也可以在 Actions 页面手动运行。
# 编译和界面测试都通过之后，安装包会被发成一个发行版（Release），不用登录就能下载。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

# 默认只读。只有最后的「发布到发行版」作业单独拿写权限。
permissions:
  contents: read

# 同一个分支上有新的构建开始时，取消还没跑完的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并打包
    # GitHub 官方托管的 Xcode 27 运行器（macOS 27，arm64）。两个上游项目自己的发版流程用的也是它。
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: 检出代码和上游子模块
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 准备工程（XcodeGen、上游补丁、标签数据）
        run: bash scripts/ci_setup.sh

      - name: 缓存 Swift 包
        uses: actions/cache@v5
        with:
          path: |
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('upstream/versions.json', 'project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: 编译并打包 IPA
        run: bash scripts/build_ipa.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v7
        with:
          name: Hub-ipa
          path: build/Hub.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传完整构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  # 与上面的作业并行：在模拟器里跑宿主壳的界面测试，确认启动和切换模块都正常。
  smoke:
    name: 模拟器界面测试
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: 检出代码和上游子模块
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 准备工程（XcodeGen、上游补丁、标签数据）
        run: bash scripts/ci_setup.sh

      - name: 缓存 Swift 包
        uses: actions/cache@v5
        with:
          path: |
            build/DerivedData-sim/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-sim-${{ runner.os }}-${{ hashFiles('upstream/versions.json', 'project.yml') }}
          restore-keys: |
            spm-sim-${{ runner.os }}-

      - name: 在模拟器里跑界面测试
        run: bash scripts/smoke_test.sh

      # 只上传整理过的测试结果。截图和完整日志不上传：测试会进入 EhPanda 的主页，
      # 它们里面可能带有站点内容，而公开仓库的构建产物谁都能下载。
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: build/smoke/result.txt
          if-no-files-found: ignore
          retention-days: 7

  # 上面两个作业都通过之后，把安装包发成一个发行版（Release）。每次构建一个，旧的不删。
  # 单独放一个作业有两个原因：要等界面测试的结果；写权限只给这里，
  # 而这里不编译、不拉取任何依赖，只把上面编出来的安装包当文件传上去。
  release:
    name: 发布到发行版
    needs: [build, smoke]
    # 只发 main 上的构建。手动运行别的分支时，安装包只在上面的 Artifacts 里。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 创建发行版和标签需要写权限。
    permissions:
      contents: write
    steps:
      # 不需要子模块；要完整的历史和标签，用来找上一个发行版、列出这一版的改动。
      # 之后只在本地读 git，发布走 gh，所以不把凭据留在 git 配置里。
      - name: 检出代码（带完整历史和标签）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 取回安装包
        uses: actions/download-artifact@v8
        with:
          name: Hub-ipa
          path: dist

      - name: 创建发行版并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/publish_release.py dist
